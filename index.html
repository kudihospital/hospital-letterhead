<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KUDI Hospital Letterhead</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .form-container {
      max-width: 800px;
      margin: 0 auto 20px;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    .form-container h2 {
      text-align: center;
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #16325c;
      color: white;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: auto;
      background: white;
      padding: 12mm 15mm;
    }

    .hospital-header {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 3px solid #16325c;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .hospital-logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .hospital-info {
      flex: 1;
      text-align: center;
    }

    .hospital-header h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #16325c;
    }

    .hospital-header p {
      margin: 4px 0;
      font-size: 13px;
    }

    .patient-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px 30px;
      margin-top: 20px;
    }

    .detail {
      font-size: 16px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    @media print {
      body {
        padding: 0;
        background: white;
      }

      .form-container {
        display: none;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 12mm 15mm;
      }

      @page {
        size: A4;
        margin: 0;
      }
    }

    @media screen and (max-width: 850px) {
      .page {
        width: 100%;
        min-height: auto;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">

    <h2>Patient Details</h2>

    <div class="form-group">
      <label for="patientName">Patient Name</label>
      <input type="text" id="patientName">
    </div>

    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age">
    </div>

    <div class="form-group">
      <label for="gender">Gender</label>

      <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="uhid">Patient ID / UHID</label>
      <input type="text" id="uhid">
    </div>

    <div class="form-group">
      <label for="mobile">Mobile Number</label>
      <input type="text" id="mobile">
    </div>

    <button onclick="printLetter()">Print Letterhead</button>

  </div>


  <div class="page">

    <div class="hospital-header">

      <img src="logo" alt="KUDI Hospital Logo" class="hospital-logo">
      >

      <div class="hospital-info">

        <h1>KUDI Hospital And Rehabilitation Center</h1>

        <p>
          Bheruji Mod, NH52, Near Raghu Palace Hotel,
          Reengus (Raj.) - 332404
        </p>

        <p>
          Email: kudihospitals@gmail.com
        </p>

      </div>

    </div>


    <div class="patient-details">

  <div class="detail patient-name">
    <strong>Patient Name:</strong>
    <span id="printName"></span>
  </div>

  <div class="detail">
    <strong>Age / Sex:</strong>
    <span id="printAge"></span> /
    <span id="printGender"></span>
  </div>

  <div class="detail">
    <strong>UHID:</strong>
    <span id="printUHID"></span>
  </div>

  <div class="detail">
    <strong>Date:</strong>
    <span id="printDate"></span>
  </div>

  <div class="detail">
    <strong>Mobile:</strong>
    <span id="printMobile"></span>
  </div>

</div>

    </div>

  </div>


  <script>
    function printLetter() {

      document.getElementById("printName").textContent =
        document.getElementById("patientName").value;

      document.getElementById("printAge").textContent =
        document.getElementById("age").value;

      document.getElementById("printGender").textContent =
        document.getElementById("gender").value;

      document.getElementById("printUHID").textContent =
        document.getElementById("uhid").value;

      document.getElementById("printMobile").textContent =
        document.getElementById("mobile").value;

      document.getElementById("printDate").textContent =
        new Date().toLocaleDateString("en-IN");

      window.print();
    }
  </script>

</body>
</html>
