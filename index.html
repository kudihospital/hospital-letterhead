<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hospital Letterhead</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .form-container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .form-container h2 {
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: auto;
      background: white;
      padding: 15mm;
    }

    .hospital-header {
      text-align: center;
      border-bottom: 3px solid black;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .hospital-header h1 {
      margin: 0;
      font-size: 26px;
    }

    .hospital-header p {
      margin: 5px 0;
    }

    .patient-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 30px;
      margin-bottom: 30px;
    }

    .detail {
      font-size: 16px;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .form-container {
        display: none;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 15mm;
      }

      @page {
        size: A4;
        margin: 0;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">

    <h2>Patient Details</h2>

    <div class="form-group">
      <label>Patient Name</label>
      <input type="text" id="patientName">
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number" id="age">
    </div>

    <div class="form-group">
      <label>Gender</label>

      <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Patient ID / UHID</label>
      <input type="text" id="uhid">
    </div>

    <div class="form-group">
      <label>Mobile Number</label>
      <input type="text" id="mobile">
    </div>

    <button onclick="printLetter()">Print Letterhead</button>

  </div>


  <div class="page">

    <div class="hospital-header">

      <h1>YOUR HOSPITAL NAME</h1>

      <p>Hospital Address, City, State - PIN Code</p>

      <p>
        Phone: +91 XXXXX XXXXX |
        Email: hospital@email.com
      </p>

    </div>


    <div class="patient-details">

      <div class="detail">
        <strong>Patient Name:</strong>
        <span id="printName"></span>
      </div>

      <div class="detail">
        <strong>Age:</strong>
        <span id="printAge"></span>
      </div>

      <div class="detail">
        <strong>Gender:</strong>
        <span id="printGender"></span>
      </div>

      <div class="detail">
        <strong>UHID:</strong>
        <span id="printUHID"></span>
      </div>

      <div class="detail">
        <strong>Mobile:</strong>
        <span id="printMobile"></span>
      </div>

      <div class="detail">
        <strong>Date:</strong>
        <span id="printDate"></span>
      </div>

    </div>

  </div>


  <script>

    function printLetter() {

      document.getElementById("printName").textContent =
        document.getElementById("patientName").value;

      document.getElementById("printAge").textContent =
        document.getElementById("age").value;

      document.getElementById("printGender").textContent =
        document.getElementById("gender").value;

      document.getElementById("printUHID").textContent =
        document.getElementById("uhid").value;

      document.getElementById("printMobile").textContent =
        document.getElementById("mobile").value;

      document.getElementById("printDate").textContent =
        new Date().toLocaleDateString();

      window.print();

    }

  </script>

</body>
</html>
